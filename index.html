<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1f33">
  <meta name="referrer" content="no-referrer">
  <title>WIN5 生存買い目</title>
  <style>
    :root{
      --ink:#12202f;--muted:#6b7c8d;--line:#e2e9f0;--bg:#eef2f7;--card:#fff;
      --alive:#0f6b3f;--alive-bg:#e8f6ee;--alive-line:#8fd0ac;
      --dead:#9aa7b4;--warn:#b3261e;--gold:#a86b00;--hud:#0b1f33;--accent:#1763a6;
      --pad:14px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;max-width:100%;overflow-x:hidden}
    body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:96px}
    button{font-family:inherit;cursor:pointer}

    /* ---------- HUD ---------- */
    .hud{position:sticky;top:0;z-index:30;background:var(--hud);color:#fff;padding:10px var(--pad) 9px;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 3px 16px #07142144}
    .hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .hud-brand{font-size:1.65rem;font-weight:900;letter-spacing:.08em;line-height:1}
    .hud-status{display:inline-flex;align-items:center;margin-top:2px;font-size:.78rem;font-weight:800;letter-spacing:.02em;color:#bcd6ee}
    .hud-status.dead{color:#ffb4ad}
    .hud-status.win{color:#ffd77a}
    .hud-btn{background:#20374d;color:#dbe6f0;border:0;border-radius:999px;padding:7px 13px;font-size:.8rem}
    .hud-count{display:flex;align-items:baseline;gap:7px;margin-top:7px;line-height:1;white-space:nowrap}
    .hud-count .prefix{font-size:1.12rem;font-weight:700}
    .hud-count b{font-size:2.65rem;font-weight:900;letter-spacing:-.03em}
    .hud-count span{font-size:1.12rem;font-weight:700;opacity:.9}
    .hud-info{display:grid;gap:3px;margin-top:7px;font-size:.94rem;font-weight:750;line-height:1.3}
    .hud-next{font-size:.78rem;font-weight:650;color:#bcd6ee}
    .steps{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
    .step{flex:1 1 0;min-width:0;text-align:center;font-size:.72rem;padding:5px 2px;border-radius:8px;background:#17293b;color:#8ea6bd;white-space:nowrap}
    .step.done{background:#14402c;color:#9fe0bd}
    .step.now{background:#1763a6;color:#fff;font-weight:800}

    /* ---------- layout ---------- */
    main{padding:var(--pad);display:grid;gap:14px;max-width:760px;margin:0 auto}
    .card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px #0f213417}
    .card.hero{padding:16px 14px}
    .eyebrow{font-size:.76rem;font-weight:800;color:var(--muted);letter-spacing:.06em}
    .title{font-size:1.5rem;font-weight:800;margin:2px 0 0}
    .title .r{font-size:2.1rem}
    .lead{font-size:.86rem;color:var(--muted);margin:6px 0 0}

    /* ---------- horse ---------- */
    .race-card{scroll-margin-top:190px;padding:0;overflow:hidden;border:1px solid #dce5ed}
    .race-card.is-next{border:2px solid var(--alive-line);box-shadow:0 3px 12px #0f6b3f1f}
    .race-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:15px 15px 12px;background:#f8fafc;border-bottom:1px solid var(--line)}
    .race-place{font-size:1.38rem;font-weight:900;line-height:1.12;letter-spacing:-.02em}
    .race-name{font-size:.9rem;color:var(--muted);font-weight:650;margin-top:4px}
    .race-state{flex:0 0 auto;padding:5px 9px;border-radius:999px;background:#e8edf3;color:#536779;font-size:.72rem;font-weight:800}
    .race-card.is-next .race-state{background:var(--alive-bg);color:var(--alive)}
    .race-body{padding:13px}
    .horses{display:grid;gap:10px}
    .horse{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;
      width:100%;min-height:78px;padding:12px;text-align:left;border-radius:15px;
      border:1.5px solid var(--line);background:#f6f8fb;color:var(--ink);font-size:1rem}
    .horse .num{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#fff;border:1px solid #d8e1ea;font-size:1.65rem;font-weight:900;text-align:center;line-height:1}
    .horse .nm{min-width:0;font-size:1.12rem;font-weight:800;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
    .horse .sub{display:block;font-size:.78rem;font-weight:550;color:var(--muted);margin-top:4px}
    .horse .pt{font-size:1.24rem;font-weight:900;white-space:nowrap;text-align:right;line-height:1.05}
    .horse .pt small{display:block;font-size:.68rem;font-weight:700;color:var(--muted);text-align:right;margin-bottom:3px}
    .horse.alive{background:var(--alive-bg);border-color:var(--alive-line)}
    .horse.alive .pt{color:var(--alive)}
    .horse.winner{background:var(--alive);border-color:var(--alive);color:#fff}
    .horse.winner .sub{color:#cdebd9}
    .horse.winner .pt{font-size:1.02rem;color:#fff}
    .horse.dead,.horse.notinplan{background:#f2f4f7;border-color:#eceff3;color:#9aa7b4}
    .horse.dead .pt,.horse.notinplan .pt{font-size:.9rem;color:#9aa7b4}
    .horse.alive .num{border-color:var(--alive-line);color:var(--alive)}
    .horse.winner .num{color:var(--alive);border-color:#fff}
    .other-horses{display:grid;gap:9px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
    .other-toggle{width:100%;margin-top:10px;border:0;background:#eef3f7;color:#3f5870;border-radius:11px;padding:11px;font-size:.86rem;font-weight:750}

    /* ---------- compact rows ---------- */
    .rows{display:grid;gap:8px;margin-top:10px}
    .row-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
      width:100%;text-align:left;background:#f6f8fb;border:1px solid var(--line);border-radius:12px;
      padding:11px 12px;min-height:52px;font-size:.95rem;color:var(--ink)}
    .row-item .tag{font-weight:800;font-size:.9rem;white-space:nowrap}
    .row-item.done .tag{color:var(--alive)}
    .row-item .meta{font-size:.82rem;color:var(--muted);white-space:nowrap}
    .row-item .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
    .btn{border:0;border-radius:11px;padding:12px 15px;font-size:.92rem;font-weight:700;background:#e7edf4;color:#243b52}
    .btn.primary{background:var(--accent);color:#fff}
    .btn.ghost{background:transparent;color:var(--accent);padding-left:2px;padding-right:2px}
    .btn.full{flex:1 1 100%;text-align:center}

    .hero.dead-hero{background:#2b2f34;color:#fff}
    .hero.dead-hero .lead{color:#c9d2da}
    .hero.win-hero{background:linear-gradient(135deg,#0f6b3f,#0b8f52);color:#fff}
    .hero.win-hero .lead{color:#d6f2e2}
    .combo-big{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.6rem;font-weight:800;margin-top:8px;letter-spacing:.04em}

    /* ---------- sheet ---------- */
    .sheet-bg{position:fixed;inset:0;background:#0b1f3366;z-index:40;display:none}
    .sheet-bg.open{display:block}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:18px 18px 0 0;
      padding:16px var(--pad) calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;display:none}
    .sheet.open{display:block}
    .sheet h2{margin:0 0 10px;font-size:1.05rem}
    .sheet .close{position:absolute;right:12px;top:12px}
    .combos{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem;line-height:1.85}
    .combos div{white-space:nowrap;overflow-x:auto}
    .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:.86rem}
    .kv dt{color:var(--muted)}
    .kv dd{margin:0;word-break:break-all}

    .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#ffffffee;backdrop-filter:blur(6px);
      border-top:1px solid var(--line);padding:9px var(--pad) calc(9px + env(safe-area-inset-bottom));
      display:flex;gap:9px}
    .bar .btn{flex:1;text-align:center}

    .msg{padding:12px;border-radius:12px;background:#fff;font-size:.9rem}
    .msg.error{background:#fdecea;color:var(--warn)}
    .runs{display:grid;gap:10px}
    .run{display:grid;gap:3px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
      border-radius:14px;padding:14px;min-height:64px;color:var(--ink)}
    .run b{font-size:1.12rem}
    .run .sub{font-size:.8rem;color:var(--muted)}
    .run .rid{font-size:.68rem;color:#9aa7b4;word-break:break-all}
    .hidden{display:none!important}
    .hud-btns{display:flex;gap:6px}
    .run.current{border:2px solid var(--alive-line)}
    .run .mode{font-size:.72rem;font-weight:800;color:var(--accent)}
    .ftable{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:4px}
    .ftable th,.ftable td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center;vertical-align:top}
    .ftable th{font-size:.72rem;color:var(--muted);font-weight:800;position:sticky;top:0;background:#fff}
    .ftable td.id{color:var(--muted);font-size:.72rem;white-space:nowrap}
    .ftable td.num{font-weight:800;white-space:nowrap}
    .ftable td.leg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;word-break:break-word}
    .ftable td.leg b{color:var(--alive)}
    .pub-note{font-size:.76rem;color:var(--muted);text-align:center;margin:4px 0 0}
    .pick-note{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;
      border-radius:12px;background:#fff7e6;color:#6b4a00;font-size:.82rem;font-weight:700}
    .pick-note .btn{padding:8px 11px;font-size:.8rem;background:#fff;color:#6b4a00;border:1px solid #f0d8a8;white-space:nowrap}
    .hud-btn:disabled{opacity:.35}

    @media(min-width:760px){
      main{display:block}
      #board{display:grid!important;gap:14px!important}
      .horses{grid-template-columns:1fr 1fr}
      .hud-count b{font-size:3.4rem}
    }
  </style>
</head>
<body>
<header class="hud">
  <div class="hud-row">
    <div><div class="hud-brand">WIN5</div><div id="state" class="hud-status" data-status="">読み込み中</div></div>
    <div class="hud-btns"><button id="clearPicks" class="hud-btn">全解除</button><button id="openPicker" class="hud-btn">過去開催</button><button id="openDetail" class="hud-btn">詳細</button></div>
  </div>
  <div class="hud-count"><span class="prefix">残り</span><b id="alive">-</b><span id="total">/ -点</span></div>
  <div class="hud-info"><div id="purchaseAmount">購入額 -円</div><div id="formationAlive">formation -</div><div id="anchor">軸 -</div><div id="hudNext" class="hud-next"></div></div>
  <div id="steps" class="steps"></div>
</header>

<main>
  <div id="message" class="msg hidden"></div>
  <section id="picker" class="card span2 hidden">
    <div class="eyebrow">開催一覧</div>
    <h1 class="title">開催を選ぶ</h1>
    <div id="runs" class="runs" style="margin-top:12px"></div>
    <div class="actions"><button id="closePicker" class="btn full">閉じる</button></div>
  </section>
  <div id="pickNote" class="pick-note hidden"></div>
  <div id="board" class="span2" style="display:grid;gap:12px"></div>
  <p class="pub-note" id="updated"></p>
</main>

<div class="bar" id="bar">
  <button id="toggleCombos" class="btn">残り買い目</button>
  <button id="toggleFormations" class="btn">formation</button>
  <button id="backTop" class="btn">画面上部へ</button>
</div>

<div id="sheetBg" class="sheet-bg"></div>

<div id="combosSheet" class="sheet">
  <button class="btn ghost close" data-close="combosSheet">閉じる</button>
  <h2>残り買い目 <span id="combosCount"></span></h2>
  <div class="actions" style="margin-top:0"><button id="toggleNames" class="btn">馬名を表示</button></div>
  <div class="combos" id="combos"></div>
</div>

<div id="detailSheet" class="sheet">
  <button class="btn ghost close" data-close="detailSheet">閉じる</button>
  <h2>詳細</h2>
  <dl class="kv" id="detailBody"></dl>
  <p class="lead" style="margin-top:14px">馬の横の「N点」は、その馬が勝った場合に残る買い目の数です。</p>
  <p class="lead">馬をタップすると、その馬を含む買い目だけに絞り込みます。もう一度タップすると解除できます。絞り込みはこのブラウザの中だけで行い、PCやサーバーには何も送信しません。再読み込みすると選択は消えます。</p>
  <p class="lead">この画面は閲覧専用の公開版です。表示内容はBUILD済みの買い目と入力済みの勝ち馬で、自動更新されます。</p>
</div>

<div id="formationSheet" class="sheet">
  <button class="btn ghost close" data-close="formationSheet">閉じる</button>
  <h2>formation <span id="formationCount"></span></h2>
  <table class="ftable"><thead id="formationHead"></thead><tbody id="formationBody"></tbody></table>
</div>

<script>
// Public read-only copy of win5_live_survivor.html.
// Reads static JSON only (data/index.json, data/runs/<run_id>.json). No API, no writes.
// Tapping a horse narrows the published purchase set inside this browser only;
// the selection lives in memory and is never sent anywhere.
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
let runId=params.get('run_id')||'';
let index=null,run=null,base=null,view=null,showNames=false,expandedOthers={};
let combos=null,picks={},edited=false,pickedRun='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={ALIVE:{text:'WIN5 生存中',cls:''},DEAD:{text:'WIN5終了',cls:'dead'},COMPLETE:{text:'WIN5的中！',cls:'win'}};
const REFRESH_MS=60000;

// survivor-core:start  (pure functions; same rules as tools/win5_survivor_state.view_state)
const LEGS=[1,2,3,4,5];
function expandFormations(formations,expectedPoints){
  // Formations are a disjoint cover of the purchase set; null if they are not.
  const out=[],seen=new Set();
  for(const f of formations||[]){
    const sets=(f.legs||[]).map(l=>l.map(Number));
    if(sets.length!==5)return null;
    const walk=(leg,acc)=>{
      if(leg===5){const key=acc.join('-');if(seen.has(key))return false;seen.add(key);out.push(acc.slice());return true}
      for(const u of sets[leg]){acc.push(u);if(!walk(leg+1,acc))return false;acc.pop()}
      return true;
    };
    if(!walk(0,[]))return null;
  }
  if(!out.length||out.length!==Number(expectedPoints))return null;
  out.sort((a,b)=>{for(let i=0;i<5;i++)if(a[i]!==b[i])return a[i]-b[i];return 0});
  return out;
}
function computeView(published,purchased,selection){
  const winners={};
  for(const [leg,u] of Object.entries(selection||{}))if(u!=null)winners[Number(leg)]=Number(u);
  const decided=Object.keys(winners).map(Number).sort((a,b)=>a-b);
  const alive=purchased.filter(c=>decided.every(leg=>c[leg-1]===winners[leg]));
  const undecided=LEGS.filter(leg=>!(leg in winners));
  const nextLeg=undecided.length?undecided[0]:null;
  const legs=published.legs.map(ld=>{
    const winner=ld.leg in winners?winners[ld.leg]:null;
    const counts={};
    if(winner==null)for(const c of alive){const u=c[ld.leg-1];counts[u]=(counts[u]||0)+1}
    const horses=ld.horses.map(h=>{
      const count=counts[h.umaban]||0;
      return {...h,is_winner:winner===h.umaban,count_if_winner:count,alive:winner==null?count>0:winner===h.umaban};
    });
    return {...ld,decided:winner!=null,winner,is_next:ld.leg===nextLeg,
      alive_horse_count:horses.filter(h=>h.alive).length,horses};
  });
  return {...published,legs,surviving_points:alive.length,
    status:alive.length<=0?'DEAD':(decided.length>=5?'COMPLETE':'ALIVE'),
    decided_legs:decided,next_leg:nextLeg,
    winners:Object.fromEntries(decided.map(leg=>[String(leg),winners[leg]])),
    surviving_combinations:alive};
}
function survivingFormations(formations,selection){
  return (formations||[]).map(f=>{
    let points=1,ok=true;
    f.legs.forEach((set,i)=>{
      const u=selection[i+1];
      if(u==null)points*=set.length;else if(!set.map(Number).includes(Number(u)))ok=false;
    });
    return ok?{...f,alive_points:points}:null;
  }).filter(Boolean);
}
// survivor-core:end

function publishedWinners(v){
  const out={};for(const [leg,u] of Object.entries((v&&v.winners)||{}))if(u!=null)out[Number(leg)]=Number(u);return out;
}
const samePicks=(a,b)=>JSON.stringify(Object.entries(a).sort())===JSON.stringify(Object.entries(b).sort());

function setMessage(text,type=''){const el=$('message');if(!text){el.classList.add('hidden');return}el.classList.remove('hidden');el.className='msg'+(type?' '+type:'');el.textContent=text}
async function getJson(path){const r=await fetch(`${path}?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(`データを読み込めません (${r.status})`);return r.json()}

function horseCard(leg,horse,decided){
  const cls=['horse'];let pt='',sub='';
  const official=Number((base&&base.winners||{})[String(leg)])===horse.umaban;
  if(horse.is_winner){cls.push('winner');pt=official?'✓ 勝ち馬':'✓ 選択中'}
  else if(decided){cls.push('dead');pt=horse.in_plan?'—':'未購入'}
  else if(!horse.in_plan){cls.push('notinplan');pt='未購入'}
  else if(horse.alive){cls.push('alive');pt=`${horse.count_if_winner}点`;sub='この馬なら 残り'}
  else{cls.push('dead');pt='0点'}
  const tag=combos?'button':'div';
  return `<${tag} class="${cls.join(' ')}" data-leg="${leg}" data-umaban="${horse.umaban}">
    <span class="num">${horse.umaban}</span>
    <span class="nm">${esc(horse.bamei)}<span class="sub">${horse.popularity}人気 ${Number(horse.odds).toFixed(1)}倍</span></span>
    <span class="pt">${pt}${sub?`<small>${sub}</small>`:''}</span></${tag}>`;
}
const sortHorses=(horses,decided)=>[...horses].sort((a,b)=>{
  const rank=h=>h.is_winner?0:(decided?(h.in_plan?1:2):(h.alive?1:(h.in_plan?2:3)));
  return rank(a)-rank(b)||(b.count_if_winner-a.count_if_winner)||(a.popularity-b.popularity);
});

function raceCard(leg){
  const ordered=sortHorses(leg.horses,leg.decided);
  const visible=ordered.filter(h=>h.alive);
  const others=ordered.filter(h=>!h.alive);
  const isOpen=Boolean(expandedOthers[leg.leg]);
  const official=leg.decided&&Number((base.winners||{})[String(leg.leg)])===Number(leg.winner);
  const state=leg.decided?(official?'確定':'選択中'):(leg.is_next?'次のレース':`生存 ${visible.length}頭`);
  return `<section class="card race-card${leg.is_next?' is-next':''}" data-race="${leg.leg}">
    <div class="race-head"><div><div class="eyebrow">LEG ${leg.leg}</div>
      <div class="race-place">${esc(leg.venue)}${leg.rno}R</div><div class="race-name">${esc(leg.race_name||'')}</div></div>
      <span class="race-state">${state}</span></div>
    <div class="race-body"><div class="horses">${visible.map(h=>horseCard(leg.leg,h,leg.decided)).join('')||'<div class="lead">生存馬なし</div>'}</div>
      ${others.length?`<button class="other-toggle" data-others="${leg.leg}">${isOpen?'その他の馬を閉じる':`その他の馬を見る（${others.length}頭）`}</button>
        <div class="other-horses${isOpen?'':' hidden'}">${others.map(h=>horseCard(leg.leg,h,leg.decided)).join('')}</div>`:''}
      ${leg.decided&&combos?`<button class="other-toggle" data-unpick="${leg.leg}">選択を訂正する</button>`:''}
    </div></section>`;
}

function render(){
  if(!view)return;
  const st=STATUS[view.status]||{text:view.status,cls:''};
  const state=$('state');state.textContent=st.text;state.className='hud-status '+st.cls;state.dataset.status=view.status;
  $('alive').textContent=view.surviving_points;
  $('total').textContent=`/ ${view.purchase_points}点`;
  $('purchaseAmount').textContent=`購入額 ${Number(view.purchase_amount||0).toLocaleString()}円`;
  const formations=run.formations||[];
  const aliveFormations=survivingFormations(formations,picks);
  $('formationAlive').textContent=`生存formation ${aliveFormations.length} / ${formations.length}件`;
  $('anchor').textContent=view.anchor
    ?`軸 ${view.anchor.venue}${view.anchor.rno}R ${view.anchor.umaban}番 ${view.anchor.bamei}`
    :'軸 なし';
  const decided=view.legs.filter(l=>l.decided),undecided=view.legs.filter(l=>!l.decided);
  const next=view.legs.find(l=>l.is_next);
  $('hudNext').textContent=view.status==='COMPLETE'?'5レースすべて的中'
    :(next?`次 ${next.rno}R ・ 残り${undecided.length}レース`:'');
  $('steps').innerHTML=view.legs.map(l=>{
    const cls=l.decided?'done':(l.is_next?'now':'');
    const mark=l.decided?'✓':(l.is_next?'●':'○');
    return `<span class="step ${cls}">${mark}${l.rno}R</span>`;
  }).join('');

  const official=publishedWinners(base);
  const note=$('pickNote');
  if(combos&&!samePicks(picks,official)){
    note.classList.remove('hidden');
    note.innerHTML=`<span>このブラウザ内の選択で絞り込み中</span>${Object.keys(official).length
      ?'<button id="restorePicks" class="btn">入力済みの勝ち馬に戻す</button>':''}`;
    const restore=$('restorePicks');
    if(restore)restore.addEventListener('click',()=>{picks={...official};edited=false;expandedOthers={};update()});
  }else{note.classList.add('hidden');note.innerHTML=''}

  let html='';
  if(view.status==='COMPLETE'){
    const combo=(view.surviving_combinations[0]||[]).join(' - ');
    html+=`<section class="card hero win-hero"><div class="eyebrow" style="color:#d6f2e2">おめでとうございます</div>
      <h1 class="title">WIN5的中！</h1><div class="combo-big">${esc(combo)}</div>
      <p class="lead">${view.surviving_points} / ${view.purchase_points}点が的中しています。</p></section>`;
  }else if(view.status==='DEAD'){
    html+=`<section class="card hero dead-hero"><h1 class="title">WIN5終了</h1>
      <p class="lead">残り 0 / ${view.purchase_points}点。${combos?'押し間違いなら、そのレースの「選択を訂正する」から直せます。':''}</p></section>`;
  }
  html+=view.legs.map(raceCard).join('');
  $('board').innerHTML=html;

  if(combos)document.querySelectorAll('#board button.horse').forEach(b=>b.addEventListener('click',()=>pick(Number(b.dataset.leg),Number(b.dataset.umaban))));
  document.querySelectorAll('[data-unpick]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();unpick(Number(b.dataset.unpick))}));
  document.querySelectorAll('[data-others]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const k=b.dataset.others;expandedOthers[k]=!expandedOthers[k];render()}));
  $('clearPicks').disabled=!combos||!Object.keys(picks).length;
  $('combosCount').textContent=`${view.surviving_points}点`;
  const names={};for(const leg of view.legs)names[leg.leg]=Object.fromEntries(leg.horses.map(h=>[h.umaban,h.bamei]));
  $('combos').innerHTML=view.surviving_combinations.map(c=>showNames
    ?`<div>${c.map((u,i)=>`${u} ${esc(names[i+1][u]||'')}`).join(' / ')}</div>`
    :`<div>${c.join(' - ')}</div>`).join('')||'<div>なし</div>';
  $('toggleNames').textContent=showNames?'馬番だけ':'馬名を表示';
  const build=run.build||{};
  $('detailBody').innerHTML=[
    ['run_id',view.run_id],['開催日',view.target_date||'-'],['モード',run.run_mode_label||run.run_mode||'-'],
    ['プラン',view.preset_name||'-'],['条件',run.preset_description||'-'],
    ['BUILD',`${build.status==='BUILD_OK'?'完了・検証OK':(build.status||'-')}${build.verified_at?' '+String(build.verified_at).slice(11,19):''}`],
    ['予算',view.budget_yen?Number(view.budget_yen).toLocaleString()+'円':'-'],
    ['購入点数',`${view.purchase_points}点`],['購入額',`${Number(view.purchase_amount||0).toLocaleString()}円`],
    ['formation',build.formation_count!=null?`${build.formation_count}件`:'-'],['生存',`${view.surviving_points}点`],
    ['生存formation',`${aliveFormations.length}件`],
    ['軸',view.anchor?`${view.anchor.venue}${view.anchor.rno}R ${view.anchor.umaban}番 ${view.anchor.bamei}`:'なし'],
    ['選択中レース',decided.length?decided.map(l=>`${l.venue}${l.rno}R=${l.winner}`).join(' / '):'なし'],
  ].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  $('formationCount').textContent=`生存 ${aliveFormations.length} / ${formations.length}件 ・ ${view.surviving_points}点`;
  $('formationHead').innerHTML=`<tr><th>#</th>${view.legs.map(l=>`<th>${esc(l.venue)}<br>${l.rno}R</th>`).join('')}<th>点</th></tr>`;
  $('formationBody').innerHTML=aliveFormations.map(f=>`<tr><td class="id">${esc(f.formation_id)}</td>${
    f.legs.map((u,i)=>`<td class="leg">${u.map(Number).map(x=>picks[i+1]===x?`<b>${x}</b>`:x).join(',')}</td>`).join('')}<td class="num">${
    f.alive_points===Number(f.points)?esc(f.points):`${f.alive_points}/${esc(f.points)}`}</td></tr>`).join('')
    ||'<tr><td colspan="7">なし</td></tr>';
  $('updated').textContent=`BUILD ${String(run.snapshot_at||'').slice(0,16).replace('T',' ')} ・ 閲覧専用${combos?' ・ 馬をタップで絞り込み（このブラウザ内のみ）':''}`;
}

function update(){view=combos?computeView(base,combos,picks):base;render()}
function pick(leg,umaban){
  if(!combos)return;
  if(picks[leg]===umaban)delete picks[leg];else picks[leg]=umaban;
  edited=true;expandedOthers={};update();
  // render() has already rebuilt the DOM synchronously, so scroll right away.
  const next=document.querySelector('.race-card.is-next');
  if(next)next.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo({top:0,behavior:'smooth'});
}
function unpick(leg){delete picks[leg];edited=true;update()}
function clearPicks(){picks={};edited=true;expandedOthers={};update();window.scrollTo({top:0,behavior:'smooth'})}

function renderRuns(){
  $('runs').innerHTML=(index.runs||[]).map(r=>`<button class="run${r.run_id===runId?' current':''}" data-run="${esc(r.run_id)}">
      <span class="mode">${esc(r.run_mode_label||r.run_mode||'')}</span>
      <b>${esc(r.target_date||'')} ${esc(r.preset_name||'')}</b>
      <span class="sub">${r.purchase_points??'-'}点 ${r.purchase_amount?'/ '+Number(r.purchase_amount).toLocaleString()+'円':''} ・ 残り${r.surviving_points??'-'}点</span>
      <span class="rid">${esc(r.run_id)}</span></button>`).join('')||'<div class="lead">公開済みの開催がありません</div>';
  document.querySelectorAll('#runs button').forEach(b=>b.addEventListener('click',()=>{
    runId=b.dataset.run;params.set('run_id',runId);history.replaceState(null,'',`?run_id=${encodeURIComponent(runId)}`);
    $('picker').classList.add('hidden');expandedOthers={};setMessage('');loadRun().then(()=>window.scrollTo({top:0}));}));
}
async function loadRun(){
  run=await getJson(`data/runs/${encodeURIComponent(runId)}.json`);base=run.view;
  combos=expandFormations(run.formations,base.purchase_points);
  const official=publishedWinners(base);
  // A new run starts from the published winners; while the viewer has not tapped
  // anything the page keeps following them, after that their own selection is kept.
  if(pickedRun!==runId){picks=official;edited=false;pickedRun=runId;expandedOthers={}}
  else if(!edited)picks=official;
  if(!combos)setMessage('この開催は絞り込み用のformationデータが揃っていないため、表示のみです','error');
  update();
}
async function refresh(){
  try{
    index=await getJson('data/index.json');
    const known=(index.runs||[]).some(r=>r.run_id===runId);
    if(!known){
      if(runId)setMessage('指定の開催が見つからないため最新を表示しています','error');
      params.delete('run_id');runId=index.latest_run_id||'';
    }
    if(!runId){$('bar').classList.add('hidden');$('state').textContent='公開済みの開催がありません';renderRuns();$('picker').classList.remove('hidden');return}
    await loadRun();renderRuns();
  }catch(e){setMessage(e.message,'error')}
}
async function poll(){
  if(document.hidden||!index)return;
  try{
    const latest=await getJson('data/index.json');
    const newest=latest.latest_run_id;
    index=latest;
    // Top page (no run_id in the URL) follows the newest BUILD automatically.
    if(!params.get('run_id')&&newest&&newest!==runId){runId=newest;expandedOthers={}}
    await loadRun();renderRuns();
  }catch(e){/* keep the last good view */}
}
function openSheet(id){$(id).classList.add('open');$('sheetBg').classList.add('open')}
function closeSheets(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));$('sheetBg').classList.remove('open')}
$('toggleCombos').addEventListener('click',()=>openSheet('combosSheet'));
$('toggleFormations').addEventListener('click',()=>openSheet('formationSheet'));
$('clearPicks').addEventListener('click',clearPicks);
$('openDetail').addEventListener('click',()=>openSheet('detailSheet'));
$('openPicker').addEventListener('click',()=>{if(index){renderRuns();$('picker').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}});
$('closePicker').addEventListener('click',()=>$('picker').classList.add('hidden'));
$('sheetBg').addEventListener('click',closeSheets);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeSheets));
$('backTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
$('toggleNames').addEventListener('click',()=>{showNames=!showNames;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
setInterval(poll,REFRESH_MS);
refresh();
</script>
</body>
</html>
